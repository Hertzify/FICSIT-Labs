name: Android APK & Dev Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title (defaults to package.json version + dev build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK & Publish Dev Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Pre-Installed Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Read Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-dev" >> $GITHUB_OUTPUT
          echo "apk_name=ficsit-node-labs-${VERSION}-dev.apk" >> $GITHUB_OUTPUT

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps || (
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              for (const section of ["dependencies", "devDependencies"]) {
                if (!pkg[section]) continue;
                for (const k of Object.keys(pkg[section])) {
                  if (k === "tailwindcss" || k === "@tailwindcss/vite") {
                    pkg[section][k] = "4.3.3";
                  } else {
                    pkg[section][k] = "latest";
                  }
                }
              }
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            ' && npm install --legacy-peer-deps
          )
          npm run build

      - name: Initialize Capacitor Android, Game Category & Immersive Fullscreen
        run: |
          npm install --save --legacy-peer-deps @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              if (!xml.includes("android:appCategory")) {
                xml = xml.replace(
                  "<application",
                  "<application android:isGame=\"true\" android:appCategory=\"game\""
                );
              }
              if (!xml.includes("android:screenOrientation")) {
                xml = xml.replace(
                  "<activity",
                  "<activity android:screenOrientation=\"sensorLandscape\""
                );
              }
              fs.writeFileSync(manifestPath, xml);
            }

            const stylesPath = "android/app/src/main/res/values/styles.xml";
            if (fs.existsSync(stylesPath)) {
              let styles = fs.readFileSync(stylesPath, "utf8");
              if (!styles.includes("android:windowFullscreen")) {
                styles = styles.replace(
                  "<item name=\"windowNoTitle\">true</item>",
                  "<item name=\"windowNoTitle\">true</item>\n        <item name=\"android:windowFullscreen\">true</item>\n        <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>"
                );
                fs.writeFileSync(stylesPath, styles);
              }
            }

            const mainActivityPath = "android/app/src/main/java/com/ficsit/nodelabs/MainActivity.java";
            if (fs.existsSync(mainActivityPath)) {
              const javaCode = [
                "package com.ficsit.nodelabs;",
                "",
                "import android.os.Build;",
                "import android.os.Bundle;",
                "import android.view.View;",
                "import android.view.Window;",
                "import android.view.WindowManager;",
                "import androidx.core.view.WindowCompat;",
                "import androidx.core.view.WindowInsetsCompat;",
                "import androidx.core.view.WindowInsetsControllerCompat;",
                "import com.getcapacitor.BridgeActivity;",
                "",
                "public class MainActivity extends BridgeActivity {",
                "    @Override",
                "    protected void onCreate(Bundle savedInstanceState) {",
                "        super.onCreate(savedInstanceState);",
                "        enableImmersiveGameMode();",
                "    }",
                "",
                "    @Override",
                "    public void onResume() {",
                "        super.onResume();",
                "        enableImmersiveGameMode();",
                "    }",
                "",
                "    @Override",
                "    public void onWindowFocusChanged(boolean hasFocus) {",
                "        super.onWindowFocusChanged(hasFocus);",
                "        if (hasFocus) {",
                "            enableImmersiveGameMode();",
                "        }",
                "    }",
                "",
                "    private void enableImmersiveGameMode() {",
                "        Window window = getWindow();",
                "        if (window == null) return;",
                "        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);",
                "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {",
                "            WindowManager.LayoutParams lp = window.getAttributes();",
                "            lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;",
                "            window.setAttributes(lp);",
                "        }",
                "        WindowCompat.setDecorFitsSystemWindows(window, false);",
                "        View decorView = window.getDecorView();",
                "        WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, decorView);",
                "        if (controller != null) {",
                "            controller.hide(WindowInsetsCompat.Type.systemBars());",
                "            controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);",
                "        }",
                "        decorView.setSystemUiVisibility(",
                "            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY",
                "            | View.SYSTEM_UI_FLAG_LAYOUT_STABLE",
                "            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION",
                "            | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN",
                "            | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION",
                "            | View.SYSTEM_UI_FLAG_FULLSCREEN",
                "        );",
                "    }",
                "}"
              ].join("\\n");
              fs.writeFileSync(mainActivityPath, javaCode);
            }
          '

      - name: Build Android Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../${{ steps.pkg.outputs.apk_name }}"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.apk_name }}
          path: ./${{ steps.pkg.outputs.apk_name }}

      - name: Create or Update GitHub Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ github.event.inputs.release_title || format('{0} dev build', steps.pkg.outputs.version) }}
          body: |
            ## FICSIT Node Labs — ${{ steps.pkg.outputs.version }} dev build
            - **Platform**: Android (Landscape Widescreen APK) + Web
            - **Package**: `${{ steps.pkg.outputs.apk_name }}`
            - Download and install `${{ steps.pkg.outputs.apk_name }}` directly on your Android device.
          prerelease: true
          files: ./${{ steps.pkg.outputs.apk_name }}
