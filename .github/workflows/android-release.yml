name: Android APK & Dev Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title (defaults to package.json version + dev build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK & Publish Dev Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Pre-Installed Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Read Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-dev" >> $GITHUB_OUTPUT
          echo "apk_name=ficsit-node-labs-${VERSION}-dev.apk" >> $GITHUB_OUTPUT

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps || (
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              for (const section of ["dependencies", "devDependencies"]) {
                if (!pkg[section]) continue;
                for (const k of Object.keys(pkg[section])) {
                  if (k === "tailwindcss" || k === "@tailwindcss/vite") {
                    pkg[section][k] = "4.3.3";
                  } else {
                    pkg[section][k] = "latest";
                  }
                }
              }
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            ' && npm install --legacy-peer-deps
          )
          npm run build

      - name: Initialize Capacitor Android & Lock Landscape Orientation
        run: |
          npm install --save --legacy-peer-deps @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(p)) {
              let xml = fs.readFileSync(p, "utf8");
              if (!xml.includes("android:screenOrientation")) {
                xml = xml.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"");
                fs.writeFileSync(p, xml);
              }
            }
          '

      - name: Build Android Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../${{ steps.pkg.outputs.apk_name }}"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.apk_name }}
          path: ./${{ steps.pkg.outputs.apk_name }}

      - name: Create or Update GitHub Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ github.event.inputs.release_title || format('{0} dev build', steps.pkg.outputs.version) }}
          body: |
            ## FICSIT Node Labs — ${{ steps.pkg.outputs.version }} dev build
            - **Platform**: Android (Landscape Widescreen APK) + Web
            - **Package**: `${{ steps.pkg.outputs.apk_name }}`
            - Download and install `${{ steps.pkg.outputs.apk_name }}` directly on your Android device.
          prerelease: true
          files: ./${{ steps.pkg.outputs.apk_name }}
