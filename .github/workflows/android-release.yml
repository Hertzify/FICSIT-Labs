name: Native Godot 4 Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title (defaults to v{version} — Initial Release — FICSIT Labs)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build-android-apk:
    name: Build Native Godot 4 Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17 for Godot 4 Android Export
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=ficsit-labs-${VERSION}.apk" >> $GITHUB_OUTPUT

      - name: Install Headless Godot 4 & Export Templates
        run: |
          mkdir -p ~/.local/bin
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip Godot_v${GODOT_VERSION}-stable_export_templates.tpz templates

      - name: Configure Android SDK & Debug Keystore for Godot 4
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/.android/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Export Native Godot 4 Android APK (GLES3 Compatibility)
        run: |
          ~/.local/bin/godot --headless --path ./godot --import
          ~/.local/bin/godot --headless --path ./godot --export-debug "Android" "../${{ steps.pkg.outputs.apk_name }}"
          ls -lh "./${{ steps.pkg.outputs.apk_name }}"

      - name: Generate Release Notes from CHANGELOG.md
        run: |
          node scripts/extract-release-notes.mjs

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.apk_name }}
          path: ./${{ steps.pkg.outputs.apk_name }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ github.event.inputs.release_title || format('v{0} — Initial Release — FICSIT Labs', steps.pkg.outputs.version) }}
          body_path: ./RELEASE_NOTES.md
          prerelease: false
          files: ./${{ steps.pkg.outputs.apk_name }}
